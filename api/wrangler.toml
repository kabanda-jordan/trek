name = "trek-rwanda-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
JWT_SECRET = "mySecretKeyForJwtTokenGenerationThatIsLongEnoughForHS256Algorithm2026TrekRwanda"

[[kv_namespaces]]
binding = "SESSION_KV"
id = "placeholder"

[build]
command = "npm install"

[[migrations]]
binding = "DB"
database_name = "trek-rwanda-db"
database_id = "placeholder"
